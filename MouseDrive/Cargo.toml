[package]
name = "mousedrive"
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[dependencies]
libloading = "0.8"
log = "0.4"
eframe = "0.31"
egui = "0.31"
egui_plot = "0.31"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
self-replace = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"
winit = { version = "0.30", default-features = false, features = ["wayland", "x11"] }
zbus = { version = "4.4", default-features = false, features = ["async-io"] }

[features]
default = ["updater"]
updater = ["dep:flate2", "dep:self-replace", "dep:serde_json", "dep:sha2", "dep:ureq", "dep:zip"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[build-dependencies]
winresource = "0.1"
