name: CI

on:
  push:
    branches: [main, beta, linux]
    tags: ["v*"]
  pull_request:
    branches: [main, beta, linux]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: MouseDrive

      - name: Format
        run: cargo fmt --manifest-path MouseDrive/Cargo.toml --check

      - name: Clippy
        shell: bash
        run: |
          cargo clippy --manifest-path MouseDrive/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path MouseDrive/Cargo.toml --all-targets --no-default-features -- -D warnings

  build-windows:
    name: Build (Windows)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: MouseDrive

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Gecersiz tag formati: ${{ github.ref_name }} (beklenen: vX.Y.Z)"
            exit 1
          }
          $toml = Get-Content MouseDrive/Cargo.toml
          $toml = $toml -replace '^version = ".*"$', "version = `"$version`""
          Set-Content MouseDrive/Cargo.toml $toml -Encoding utf8
          Write-Host "Cargo.toml version -> $version"

      - name: Build release
        run: cargo build --release --manifest-path MouseDrive/Cargo.toml

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "MouseDrive-$tag-windows-x64.zip"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item MouseDrive/target/release/mousedrive.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath $zipName
          Copy-Item MouseDrive/target/release/mousedrive.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            MouseDrive-*-windows-x64.zip
            mousedrive.exe

  build-linux:
    name: Build (Linux)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: MouseDrive

      - name: Set version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Gecersiz tag formati: $GITHUB_REF_NAME (beklenen: vX.Y.Z)" >&2
            exit 1
          fi
          sed -i "s/^version = \".*\"$/version = \"$version\"/" MouseDrive/Cargo.toml
          echo "Cargo.toml version -> $version"

      - name: Build release
        run: cargo build --release --manifest-path MouseDrive/Cargo.toml

      - name: Package
        shell: bash
        run: |
          zip_name="MouseDrive-${GITHUB_REF_NAME}-linux-x64.zip"
          mkdir dist
          cp MouseDrive/target/release/mousedrive README.md LICENSE dist/
          (cd dist && zip -r "../$zip_name" .)

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: MouseDrive-*-linux-x64.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          sha256sum MouseDrive-*-windows-x64.zip mousedrive.exe MouseDrive-*-linux-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MouseDrive-*-windows-x64.zip
            mousedrive.exe
            MouseDrive-*-linux-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
