name: CI

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
    branches: [main, beta]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: MouseDrive

      - name: Format
        run: cargo fmt --manifest-path MouseDrive/Cargo.toml --check

      - name: Clippy
        shell: bash
        run: |
          cargo clippy --manifest-path MouseDrive/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path MouseDrive/Cargo.toml --all-targets --no-default-features -- -D warnings

  release:
    name: Build & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: MouseDrive

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Gecersiz tag formati: ${{ github.ref_name }} (beklenen: vX.Y.Z)"
            exit 1
          }
          $toml = Get-Content MouseDrive/Cargo.toml
          $toml = $toml -replace '^version = ".*"$', "version = `"$version`""
          Set-Content MouseDrive/Cargo.toml $toml -Encoding utf8
          Write-Host "Cargo.toml version -> $version"

      - name: Build release
        run: cargo build --release --manifest-path MouseDrive/Cargo.toml

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "MouseDrive-$tag-windows-x64.zip"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item MouseDrive/target/release/mousedrive.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath $zipName
          Copy-Item MouseDrive/target/release/mousedrive.exe .
          $sums = foreach ($file in $zipName, "mousedrive.exe") {
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLower())  $file"
          }
          $sums | Out-File SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MouseDrive-*-windows-x64.zip
            mousedrive.exe
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
